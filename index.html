["User Registration System","تحدي: User (الاسم والإيميل والباسورد)، وUserValidator للتحقق، وUserRepository لحفظ المستخدمين في Array. امنع الإيميل المكرر، واستخدم private وExceptions، وكل Class له مسؤولية واحدة.","Encapsulation, Composition, Separation of Responsibilities, Exceptions",
`class User{function __construct(private string $name,private string $email,private string $password){}

class UserValidator{function validate(string $n,string $e,string $p){

`interface Discount{function apply(float $p):float;}
class Percent implements Discount{function __construct(private float $r){}
function apply(float $p):float{return $p*(1-$this->r);}}
